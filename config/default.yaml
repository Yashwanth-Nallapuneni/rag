# Base configuration. Override per-environment with config/<name>.yaml, or
# per-setting with env vars: RAGPIPE_<SECTION>__<KEY> (e.g. RAGPIPE_LLM__PROVIDER).
# Every value here is part of the eval fingerprint -- changing one changes the
# config hash recorded with eval results.

corpus:
  name: arxiv-ml
  raw_dir: data/raw
  processed_dir: data/processed

ingest:
  strip_pdf_headers_footers: true
  header_footer_margin_ratio: 0.08   # top/bottom fraction of page scanned for repeats
  min_repeat_ratio: 0.5              # line must repeat on >=50% of pages to be furniture
  drop_references_section: false
  min_chars_per_doc: 500

chunking:
  strategy: token_window
  chunk_size: 650        # tokens; spec calls for 500-800
  chunk_overlap: 100     # tokens
  min_chunk_tokens: 40   # drop slivers below this
  respect_headings: true
  tokenizer: cl100k_base

embeddings:
  provider: local
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 32
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  device: auto
  cache_dir: .ragpipe_cache/embeddings

vector_store:
  provider: chroma
  path: data/chroma
  collection: ragpipe_chunks
  distance: cosine

retrieval:
  mode: hybrid           # dense | sparse | hybrid
  top_k: 5               # final chunks handed to the generator
  candidate_k: 30        # first-pass pool per retriever, feeds the reranker
  fusion: rrf            # rrf | weighted_sum
  rrf_k: 60
  dense_weight: 0.5
  sparse_weight: 0.5
  min_score: 0.0
  bm25:
    k1: 1.5
    b: 0.75
    index_path: data/processed/bm25_index.pkl

rerank:
  enabled: true
  provider: local
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 5
  batch_size: 16
  device: auto
  score_threshold: null

llm:
  provider: mock         # mock | anthropic | openai | ollama
  model: null            # null -> provider default
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 60
  max_retries: 3

prompts:
  dir: prompts
  answer_version: v2
  claim_check_version: v1

generation:
  max_context_tokens: 6000
  include_locators: true

citation:
  enforce: true
  min_supported_ratio: 0.8    # below this the answer is refused
  verifier: hybrid            # lexical | llm | hybrid
  lexical_threshold: 0.45
  require_citation_per_sentence: true
  refusal_message: >-
    I can't answer that from the indexed documents. The retrieved passages
    don't contain enough supporting evidence for a reliable answer.

evaluation:
  dataset_path: eval/golden_dataset.jsonl
  results_dir: eval_results
  metrics: [faithfulness, answer_relevancy, context_precision, context_recall]
  sample_size: null
  concurrency: 4
  thresholds:
    faithfulness: 0.80
    answer_relevancy: 0.70
    context_precision: 0.65
    context_recall: 0.65
    refusal_accuracy: 0.80

api:
  host: 0.0.0.0
  port: 8000
  cors_origins: ["*"]

logging:
  level: INFO
  json: false
