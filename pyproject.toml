[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragpipe"
version = "0.1.0"
description = "Production-grade RAG over an arXiv ML corpus: hybrid retrieval, cross-encoder reranking, enforced citations, and a CI-gated RAGAS evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "pypdf>=4.2",
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "rank-bm25>=0.2.2",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
eval = ["ragas==0.4.3", "langchain-community==0.4.1", "datasets>=2.19", "pandas>=2.2"]
ui = ["streamlit>=1.35"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.30"]
cohere = ["cohere>=5.5"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
ragpipe = "ragpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: downloads models or hits the network",
  "integration: exercises the full pipeline end to end",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
